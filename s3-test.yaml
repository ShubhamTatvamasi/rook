apiVersion: v1
kind: Pod
metadata:
  name: s3-test
  namespace: default
spec:
  restartPolicy: Never

  containers:
    - name: aws
      image: amazon/aws-cli

      command:
        - /bin/sh
        - -c
        - |
          set -e

          mkdir -p ~/.aws

          cat > ~/.aws/config <<EOF
          [default]
          region = ${BUCKET_REGION:-us-east-1}
          endpoint_url = http://${BUCKET_HOST}:${BUCKET_PORT}
          EOF

          echo "=== Environment ==="
          echo "BUCKET_HOST=${BUCKET_HOST}"
          echo "BUCKET_PORT=${BUCKET_PORT}"
          echo "BUCKET_NAME=${BUCKET_NAME}"
          echo "BUCKET_REGION=${BUCKET_REGION}"

          echo "=== AWS Config ==="
          cat ~/.aws/config

          echo "=== Upload ==="
          echo "hello from rook-ceph" > /tmp/test.txt

          aws s3 cp \
            /tmp/test.txt \
            "s3://${BUCKET_NAME}/test.txt"

          echo "=== List ==="

          aws s3 ls \
            "s3://${BUCKET_NAME}/"

          echo "=== Download ==="

          aws s3 cp \
            "s3://${BUCKET_NAME}/test.txt" \
            /tmp/downloaded.txt

          echo "=== Content ==="
          cat /tmp/downloaded.txt

          echo "=== Test completed ==="

          sleep infinity

      env:
        - name: BUCKET_HOST
          valueFrom:
            configMapKeyRef:
              name: ceph-test-bucket
              key: BUCKET_HOST

        - name: BUCKET_PORT
          valueFrom:
            configMapKeyRef:
              name: ceph-test-bucket
              key: BUCKET_PORT

        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: ceph-test-bucket
              key: BUCKET_NAME

        - name: BUCKET_REGION
          valueFrom:
            configMapKeyRef:
              name: ceph-test-bucket
              key: BUCKET_REGION

      envFrom:
        - secretRef:
            name: ceph-test-bucket
