---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test-pod
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            date '+%Y-%m-%d %H:%M:%S.%N' | tee -a /data/timestamps.log
            sleep 0.1
          done
      volumeMounts:
        - name: ceph-storage
          mountPath: /data
  volumes:
    - name: ceph-storage
      persistentVolumeClaim:
        claimName: ceph-test-pvc
