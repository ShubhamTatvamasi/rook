---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test-pod
  namespace: default
spec:
  containers:
    - name: writer
      image: busybox:1.38
      command:
        - /bin/sh
        - -c
        - |
          i=0
          while true; do
            i=$((i + 1))
            echo "$(date '+%Y-%m-%d %H:%M:%S') write=$i" | tee -a /data/timestamps.log
            sleep 0.1
          done
      volumeMounts:
        - name: ceph-storage
          mountPath: /data
  volumes:
    - name: ceph-storage
      persistentVolumeClaim:
        claimName: ceph-test-pvc
